name: validate cppwinrt
defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - fix/cppwinrt-winmd-url

jobs:
  validate_cppwinrt:
    name: Building cppwinrt
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    steps:
      - name: Setup git config
        run: git config --global --add safe.directory $PWD

      - uses: actions/checkout@main

      - name: Installing Meson
        run: |
          python -m pip --version || pacman -Sy --needed --noconfirm python-pip
          python -m pip install --upgrade --break-system-packages 'meson>=1.3.0'

      - name: Building cppwinrt
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DLLVM_ENABLE_PGO=GEN -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_cppwinrt/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_cppwinrt -S $PWD
          ninja -C build_cppwinrt cppwinrt
